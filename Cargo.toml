[package]
name = "mlsys2026-graph-scheduling"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "mlsys"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.58", features = ["derive"] }
fraction = "0.15.3"
good_lp = { version = "1.15.0", features = ["scip", "scip_bundled"], default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
